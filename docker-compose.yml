services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfg-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - mfg-network
      - netheril-integration
      - vivaldi-integration
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    container_name: mfg-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - mfg-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mfg-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: many_faced_god
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: mfg_user
    ports:
      - "33306:3306"
    volumes:
      - mfg-db-data:/var/lib/mysql
    networks:
      # Same alias as docker-compose.prod.yml so DB_HOST=mfg-db works in both.
      # See the comment there for why the bare service name is not safe (#74).
      mfg-network:
        aliases:
          - mfg-db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 15

networks:
  mfg-network:
    driver: bridge
  netheril-integration:
    external: true
  vivaldi-integration:
    external: true

volumes:
  mfg-db-data:
    driver: local
