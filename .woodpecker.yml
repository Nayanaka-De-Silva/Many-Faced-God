steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: mfg-ci
    commands:
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test
    when:
      - event: [push, pull_request]

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t many-faced-god-app:latest .
      - echo "Building nginx images"
      - docker build -t many-faced-god-nginx:latest .
      - echo "Build completed successfully"
    when:
      - event: push
        branch: master

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  - name: deploy
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/krystler/containers/many-faced-god:/deploy
    commands:
      - cd /deploy
      - docker compose -p many-faced-god -f ./docker-compose.prod.yml up --force-recreate -d --remove-orphans --wait --wait-timeout 120
      - |-
          docker compose -p many-faced-god -f ./docker-compose.prod.yml exec -T app sh -lc '
          # Probe through the application database config rather than a
          # hand-built mysqladmin invocation: it uses the real DB_HOST and
          # credentials from .env, and unlike "mysqladmin ping" it fails on
          # access-denied and on a host that is not our database. See #74.
          i=0
          echo "Checking app -> db connectivity before running migrations..."
          until php artisan db:show > /dev/null 2>&1; do
            if [ "$i" -ge 10 ]; then
              echo "ERROR: database is not reachable from app after 30s" >&2
              php artisan db:show >&2 || true
              exit 1
            fi
            i=$((i+1))
            echo "Waiting for app -> db readiness ($i/10)..."
            sleep 3
          done
          php artisan migrate --force
          '
      - docker image prune -f
      - echo "Deployment completed successfully"
    when:
      - event: push
        branch: master

  # =========================
  # SMOKE (Push to main/master only)
  # =========================
  # Gates the deploy on the running stack actually serving database-backed
  # pages. The unit suite runs on sqlite and "migrate" only proves a single
  # connection worked once, so neither would have caught issue #74.
  - name: smoke
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/krystler/containers/many-faced-god:/deploy
    commands:
      - docker compose -p many-faced-god -f /deploy/docker-compose.prod.yml cp ./scripts/deploy-smoke.sh app:/tmp/deploy-smoke.sh
      - |-
          if ! docker compose -p many-faced-god -f /deploy/docker-compose.prod.yml exec -T app sh /tmp/deploy-smoke.sh; then
            echo "=== smoke tests failed; container logs follow ===" >&2
            docker compose -p many-faced-god -f /deploy/docker-compose.prod.yml logs --tail 100 app webserver db >&2
            exit 1
          fi
    when:
      - event: push
        branch: master
