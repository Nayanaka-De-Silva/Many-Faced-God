when:
  branch: [main]
  event: [push, tag]

steps:
  # =========================
  # TESTS
  # =========================
  test:
    image: php:8.3-cli
    commands:
      - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev libonig-dev libxml2-dev sqlite3
      - docker-php-ext-install pdo pdo_mysql pdo_sqlite zip gd mbstring xml bcmath
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - composer install
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test

  # =========================
  # BUILD IMAGE
  # =========================
  build-image:
    image: docker:26
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t mfg-app:latest .
      - docker tag mfg-app:latest mfg-app:${CI_COMMIT_SHA}

  # =========================
  # DEPLOY
  # =========================
  deploy:
    image: docker:26
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - cd /srv/mfg-app
      - docker compose -f docker-compose.prod.yml up -d --force-recreate
