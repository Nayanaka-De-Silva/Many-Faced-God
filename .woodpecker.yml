steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: mfg-ci
    commands:
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test
    when:
      - event: [push, pull_request]

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t many-faced-god-app:latest .
      - echo "Build completed successfully"
    when:
      - event: push
        branch: master

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  - name: deploy
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/krystler/containers/many-faced-god:/deploy
    commands:
      - cd /deploy
      # Ensure .env file exists
      - |
        if [ ! -f .env ]; then
          echo "ERROR: .env file not found in /deploy"
          exit 1
        fi
      # Check if APP_KEY exists and is properly formatted
      - |
        APP_KEY=$(grep "^APP_KEY=" .env | cut -d'=' -f2)
        if [ -z "$APP_KEY" ] || [ "$APP_KEY" = '""' ] || [ "$APP_KEY" = "''" ]; then
          echo "APP_KEY is empty. Generating new key..."
          docker compose -p many-faced-god -f docker-compose.prod.yml run --rm app php artisan key:generate --show --no-ansi > /tmp/newkey.txt
          NEW_KEY=$(cat /tmp/newkey.txt | tr -d '\n\r')
          sed -i "s|^APP_KEY=.*|APP_KEY=$NEW_KEY|" .env
          echo "APP_KEY generated successfully"
        else
          echo "APP_KEY exists: ${APP_KEY:0:15}..."
        fi
      # Validate APP_KEY format
      - |
        APP_KEY=$(grep "^APP_KEY=" .env | cut -d'=' -f2)
        if ! echo "$APP_KEY" | grep -q "^base64:"; then
          echo "WARNING: APP_KEY does not start with 'base64:' prefix"
          echo "Current value: $APP_KEY"
          echo "Regenerating with correct format..."
          docker compose -p many-faced-god -f docker-compose.prod.yml run --rm app php artisan key:generate --show --no-ansi > /tmp/newkey.txt
          NEW_KEY=$(cat /tmp/newkey.txt | tr -d '\n\r')
          sed -i "s|^APP_KEY=.*|APP_KEY=$NEW_KEY|" .env
          echo "APP_KEY regenerated successfully"
        fi
      # Start/restart containers
      - docker compose -p many-faced-god -f docker-compose.prod.yml up --force-recreate -d
      # Copy .env into app container's volume
      - sleep 5
      - docker cp .env $(docker compose -p many-faced-god -f docker-compose.prod.yml ps -q app):/var/www/html/.env
      - docker compose -p many-faced-god -f docker-compose.prod.yml exec -T app php artisan config:clear
      - docker compose -p many-faced-god -f docker-compose.prod.yml restart app
      # Cleanup
      - docker image prune -f
      # Verify deployment
      - echo "Verifying APP_KEY is loaded..."
      - docker compose -p many-faced-god -f docker-compose.prod.yml exec -T app php artisan tinker --execute="echo 'Key loaded: ' . (config('app.key') ? 'YES' : 'NO');"
      - echo "Deployment completed successfully"
    when:
      - event: push
        branch: master

