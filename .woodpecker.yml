pipeline:
  test:
    image: php:8.3-cli
    commands:
      - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev libonig-dev libxml2-dev sqlite3
      - docker-php-ext-install pdo pdo_mysql pdo_sqlite zip gd mbstring xml bcmath
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test

  cleanup-pr:
    image: php:8.3-cli
    commands:
      - echo "Tests completed for PR. Cleaning up..."
      - rm -rf vendor/
      - rm -rf .env
      - echo "Cleanup completed"
    when:
      event: pull_request

  build-image:
    image: woodpeckerci/plugin-docker-buildx:4.2.0
    settings:
      repo: many-faced-god-app
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile
      platforms: linux/amd64
    when:
      event: [push, manual]
      branch: [main, master]

  deploy:
    image: docker/compose:2.24.5
    privileged: true
    commands:
      - cd /srv/many-faced-god-app || cd ${CI_WORKSPACE}
      - docker compose -f docker-compose.prod.yml pull app || true
      - docker compose -f docker-compose.prod.yml up -d --force-recreate app
      - docker image prune -f
      - echo "Deployment completed successfully"
    when:
      event: [push, manual]
      branch: [main, master]
