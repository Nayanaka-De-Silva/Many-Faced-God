when:
  branch: [master]
  event: [push, manual]

steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: mfg-ci
    commands:
      - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev libonig-dev libxml2-dev libsqlite3-dev sqlite3
      - docker-php-ext-install pdo pdo_mysql pdo_sqlite zip gd mbstring bcmath
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: docker:24
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  - name: deploy
    image: docker:24
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose -f /home/krystler/containers/many-faced-god/docker-compose.prod.yml up -d
      - docker image prune -f
      - echo "Deployment completed successfully"
