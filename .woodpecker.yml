when:
  event: [push, pull_request, manual]

steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: php:8.3-cli
    commands:
      - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev libonig-dev libxml2-dev libsqlite3-dev sqlite3
      - docker-php-ext-install pdo pdo_mysql pdo_sqlite zip gd mbstring bcmath
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test

  # =========================
  # CLEANUP (PR only)
  # =========================
  - name: cleanup-pr
    image: php:8.3-cli
    commands:
      - echo "Tests completed for PR. Cleaning up..."
      - rm -rf vendor/
      - rm -rf .env
      - echo "Cleanup completed"
    when:
      - event: pull_request

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: woodpeckerci/plugin-docker-buildx:4.2.0
    settings:
      repo: many-faced-god-app
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile
      platforms: linux/amd64
      logins:
        - registry: localhost
      build_args:
        - BUILDKIT_INLINE_CACHE=1
    when:
      - event: [push, manual]
        branch: [main, master]

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  - name: deploy
    image: docker/compose:2.24.5
    privileged: true
    commands:
      - cd /srv/many-faced-god-app || cd ${CI_WORKSPACE}
      - docker compose -f docker-compose.prod.yml pull app || true
      - docker compose -f docker-compose.prod.yml up -d --force-recreate app
      - docker image prune -f
      - echo "Deployment completed successfully"
    when:
      - event: [push, manual]
        branch: [main, master]
