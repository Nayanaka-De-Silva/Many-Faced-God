steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: mfg-ci
    commands:
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test
    when:
      - event: [push, pull_request]

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t many-faced-god-app:latest .
      - echo "Building nginx images"
      - docker build -t many-faced-god-nginx:latest .
      - echo "Build completed successfully"
    when:
      - event: push
        branch: master

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  - name: deploy
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/krystler/containers/many-faced-god:/deploy
    commands:
      - cd /deploy
      - docker compose -p many-faced-god -f ./docker-compose.prod.yml up --force-recreate -d --remove-orphans --wait --wait-timeout 120
      - |-
          docker compose -p many-faced-god -f ./docker-compose.prod.yml exec -T app sh -lc '
          i=0
          until mysqladmin ping -h"${DB_HOST:-db}" -P"${DB_PORT:-3306}" -u"${DB_USERNAME}" -p"${DB_PASSWORD}" --silent; do
            if [ "$i" -ge 10 ]; then
              echo "ERROR: database is not reachable from app after 30s" >&2
              exit 1
            fi
            i=$((i+1))
            echo "Waiting for app -> db readiness ($i/10)..."
            sleep 3
          done
          php artisan migrate --force
          '
      - docker image prune -f
      - echo "Deployment completed successfully"
    when:
      - event: push
        branch: master
