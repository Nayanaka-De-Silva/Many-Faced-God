steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: mfg-ci
    commands:
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test
    when:
      - event: [push, pull_request]

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t many-faced-god-app:latest .
      - echo "Building nginx images"
      - docker build -t many-faced-god-nginx:latest .
      - echo "Build completed successfully"
    when:
      - event: push
        branch: master

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  # Recreates the stack, waits for a real (authenticated) app -> db
  # connection before migrating, then smoke-tests the deployed HTTP surface
  # before declaring the deploy done — folded into one step rather than a
  # separate stage, since it's one linear rollout with one failure point.
  - name: deploy
    image: docker:27
    privileged: true
    environment:
      # Production config lives in the prod_dotenv Woodpecker repo secret
      # (repo settings -> Secrets), not a file on the runner host.
      PROD_DOTENV:
        from_secret: prod_dotenv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # Assemble a throwaway deploy dir in the CI workspace (discarded when the
      # pipeline ends). --project-directory points every compose call at it for
      # the deployed .env; the db lives in a Docker named volume, untouched.
      # Every command here is a single line -- the readiness probe and smoke
      # gate are real script files run inside the container, never inline
      # `sh -lc '...'` (issues #74, #77, #78).
      - test -n "$${PROD_DOTENV}" || { echo "prod_dotenv secret missing/empty - set it in Woodpecker repo settings" >&2; exit 1; }
      - mkdir -p deploy
      - cp docker-compose.prod.yml deploy/docker-compose.prod.yml
      - printf "%s\n" "$${PROD_DOTENV}" > deploy/.env
      # The compose file joins shared external networks (one per sibling stack it
      # integrates with); whichever stack comes up first owns creating them.
      - for net in many-faced-god-network netheril-integration vivaldi-integration; do docker network inspect "$$net" >/dev/null 2>&1 || docker network create "$$net"; done
      - docker compose -p many-faced-god -f deploy/docker-compose.prod.yml --project-directory deploy up --force-recreate -d --remove-orphans --wait --wait-timeout 120
      # Copy the scripts AFTER the recreate above -- --force-recreate replaces
      # the app container, discarding anything copied into the previous one.
      - docker compose -p many-faced-god -f deploy/docker-compose.prod.yml --project-directory deploy cp ./scripts/deploy-migrate.sh app:/tmp/deploy-migrate.sh
      - docker compose -p many-faced-god -f deploy/docker-compose.prod.yml --project-directory deploy exec -T app sh /tmp/deploy-migrate.sh
      - docker compose -p many-faced-god -f deploy/docker-compose.prod.yml --project-directory deploy cp ./scripts/deploy-smoke.sh app:/tmp/deploy-smoke.sh
      - docker compose -p many-faced-god -f deploy/docker-compose.prod.yml --project-directory deploy exec -T app sh /tmp/deploy-smoke.sh || { docker compose -p many-faced-god -f deploy/docker-compose.prod.yml --project-directory deploy logs --tail 100 app webserver db >&2; exit 1; }
      - docker image prune -f
      - echo "Deployment completed successfully"
    when:
      - event: push
        branch: master
