steps:
  # =========================
  # TESTS (All events)
  # =========================
  - name: test
    image: mfg-ci
    commands:
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test
    when:
      - event: [push, pull_request]

  # =========================
  # BUILD IMAGE (Push to main/master only)
  # =========================
  - name: build-image
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t many-faced-god-app:latest .
      - echo "Building nginx images"
      - docker build -t many-faced-god-nginx:latest .
      - echo "Build completed successfully"
    when:
      - event: push
        branch: master

  # =========================
  # DEPLOY (Push to main/master only)
  # =========================
  - name: deploy
    image: docker:27
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/krystler/containers/many-faced-god:/deploy
    commands:
      - cd /deploy
      - docker compose -p many-faced-god -f ./docker-compose.prod.yml down --remove-orphans
      - docker compose -p many-faced-god -f ./docker-compose.prod.yml up --force-recreate -d --remove-orphans
      - |
        db_container=$(docker compose -p many-faced-god -f ./docker-compose.prod.yml ps -q db)
        if [ -z "$db_container" ]; then
          echo "Database container not found"
          docker compose -p many-faced-god -f ./docker-compose.prod.yml ps
          exit 1
        fi

        attempts=0
        max_attempts=30
        status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$db_container")

        until [ "$status" = "healthy" ]; do
          attempts=$((attempts + 1))

          if [ "$attempts" -ge "$max_attempts" ]; then
            echo "Database did not become healthy (last status: $status)"
            docker compose -p many-faced-god -f ./docker-compose.prod.yml logs db
            exit 1
          fi

          echo "Waiting for database to become healthy (current: $status)..."
          sleep 2
          status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$db_container")
        done
      - docker compose -p many-faced-god -f ./docker-compose.prod.yml exec -T app php artisan migrate --force
      - docker image prune -f
      - echo "Deployment completed successfully"
    when:
      - event: push
        branch: master
