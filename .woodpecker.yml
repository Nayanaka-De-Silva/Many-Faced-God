when:
  event: [push, tag, pull_request, manual]

steps:
  # =========================
  # TESTS
  # =========================
  test:
    image: php:8.3-cli
    commands:
      - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev libonig-dev libxml2-dev sqlite3
      - docker-php-ext-install pdo pdo_mysql pdo_sqlite zip gd mbstring xml bcmath
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - composer install
      - cp .env.example .env
      - php artisan key:generate
      - php artisan test

  # =========================
  # BUILD IMAGE
  # =========================
  build-image:
    image: woodpeckerci/plugin-docker-buildx:4.2.0
    settings:
      repo: many-faced-god-app
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile
      registry: localhost
      dry_run: false
    when:
      event: [push, tag, manual]
      branch: [main, master]

  # =========================
  # DEPLOY
  # =========================
  deploy:
    image: appleboy/drone-ssh:1.7.6
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      port: 22
      script:
        - cd /srv/many-faced-god-app
        - git pull origin main
        - docker compose -f docker-compose.prod.yml pull
        - docker compose -f docker-compose.prod.yml up -d --force-recreate
    when:
      event: [push, tag, manual]
      branch: [main, master]
