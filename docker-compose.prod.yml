services:
  app:
    image: many-faced-god-app:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - many-faced-god-network
    depends_on:
      - db
    volumes:
      - app-code:/var/www/html

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8765:80"
    volumes:
      - app-code:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/nginx/certs
    volumes_from:
      - app
    networks:
      - many-faced-god-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - many-faced-god-db-data:/var/lib/mysql
    networks:
      - many-faced-god-network

networks:
  many-faced-god-network:
    external: true

volumes:
  many-faced-god-db-data:
  app-code:
