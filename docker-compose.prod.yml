name: many-faced-god

services:
  app:
    image: many-faced-god-app:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - many-faced-god-network
      - netheril-integration
      - vivaldi-integration
    depends_on:
      db:
        condition: service_healthy

  webserver:
    # Built by the CI build-image step from docker/nginx/Dockerfile (the vhost
    # is baked in). No build context here: the deployed stack only ever has the
    # compose file and .env alongside it, not the repo tree.
    image: many-faced-god-nginx:latest
    restart: unless-stopped
    ports:
      - "8765:80"
    networks:
      - many-faced-god-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - many-faced-god-db-data:/var/lib/mysql
    networks:
      # app also joins netheril-integration and vivaldi-integration, which are
      # owned by other stacks. Docker's embedded DNS answers from every network a
      # container has joined, so the bare service name "db" is only unique inside
      # our own network — a "db" service in a foreign stack makes it resolve
      # non-deterministically (issue #74). DB_HOST points at this alias instead.
      many-faced-god-network:
        aliases:
          - mfg-db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 15

networks:
  many-faced-god-network:
    external: true
  netheril-integration:
    external: true
  vivaldi-integration:
    external: true

volumes:
  many-faced-god-db-data:
